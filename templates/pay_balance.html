{% extends "base.html" %}
{% block page_title %}Pay Balance - {{ member.name }}{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Balance Payment</h2>
    <p>Member: <strong>{{ member.name }}</strong></p>
    <p>Plan: {{ member.plan_name }}</p>
    <p>Outstanding Balance: <strong>Rs.{{ '%.0f'|format(member.balance_amount) }}</strong></p>
    <form method="POST" class="form">
        <div class="form-group">
            <label for="amount">Payment Amount (Rs.)</label>
            <input type="number" step="0.01" name="amount" id="amount" class="form-control" max="{{ member.balance_amount }}" required placeholder="Enter amount">
        </div>
        <div class="form-group">
            <label for="payment_date">Payment Date</label>
            <input type="date" name="payment_date" id="payment_date" class="form-control" value="{{ now.strftime('%Y-%m-%d') }}">
        </div>
        <div class="form-group">
            <label for="payment_mode">Payment Mode</label>
            <select name="payment_mode" id="payment_mode" class="form-control">
                <option value="Cash">Cash</option>
                <option value="Online">Online</option>
                <option value="Card">Card</option>
                <option value="Both">Both</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Record Payment</button>
            <a href="{{ url_for('member_detail', member_id=member.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
