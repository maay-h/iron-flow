{% extends "base.html" %}
{% block page_title %}Change Password{% endblock %}
{% block content %}
<div class="form-card">
    <h2 style="margin-bottom:20px;">Change Password</h2>
    <form method="POST" class="form">
        <div class="form-group">
            <label for="current_password">Current Password</label>
            <input type="password" name="current_password" id="current_password" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" name="new_password" id="new_password" class="form-control" required minlength="4">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" name="confirm_password" id="confirm_password" class="form-control" required minlength="4">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Password</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
